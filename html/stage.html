    <!-- ---------------- STAGE ---------------- -->
    <section class="stage" aria-label="Proofs and output">

      <div class="preview-grid">

        <!-- ---- ORIGINAL ---- -->
        <section class="proof" aria-label="Original scan with detection overlay">
          <div class="proof-head">
            <div class="proof-title">Original</div>
            <div class="spacer"></div>
            <div class="tool-group" role="group" aria-label="Show detection layers">
              <button class="tool" id="tglBoxes" type="button" aria-pressed="true" title="Colour regions (1)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><rect x="3.6" y="3.6" width="16.8" height="16.8" rx="1"/></svg>
              </button>
              <button class="tool" id="tglLines" type="button" aria-pressed="true" title="Rules and borders (2)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M3.6 7h16.8M3.6 17h16.8M9 3.6v16.8"/></svg>
              </button>
              <button class="tool" id="tglText" type="button" aria-pressed="true" title="Type boxes (3)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M5 6.4V4.6h14v1.8M12 4.6v14.8M9.4 19.4h5.2"/></svg>
              </button>
              <button class="tool" id="tglGfx" type="button" aria-pressed="true" title="Artwork (4)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.4l2.5 5.6 6.1.6-4.6 4 1.4 5.9L12 16.4 6.6 19.5l1.4-5.9-4.6-4 6.1-.6z"/></svg>
              </button>
            </div>
            <div class="tool-group" role="group" aria-label="Zoom">
              <button class="tool" id="zoomOut" type="button" title="Zoom out (−)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.4"/><path d="M15.6 15.6L20 20M8 10.8h5.6"/></svg>
              </button>
              <span class="zoom-label" id="zoomLabel">fit</span>
              <button class="tool" id="zoomIn" type="button" title="Zoom in (+)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.4"/><path d="M15.6 15.6L20 20M8 10.8h5.6M10.8 8v5.6"/></svg>
              </button>
            </div>
          </div>

          <div class="viewport" id="originalViewport">
            <div class="viewport-inner" id="originalInner">
              <canvas id="originalCanvas" width="900" height="620" aria-label="Original document"></canvas>
            </div>
            <div class="empty" id="originalEmpty">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="1" stroke-dasharray="2.5 2.5"/><path d="M12 8.5v7M8.5 12h7"/></svg>
              <b>Nothing on the board</b>
              <span>Drop a scan into the source panel, or load one of the two samples.</span>
            </div>
          </div>

          <div class="proof-foot">
            <div class="legend" aria-label="Overlay colours">
              <span><i style="background:var(--layer-bg)"></i>regions</span>
              <span><i style="background:var(--layer-line)"></i>rules</span>
              <span><i style="background:var(--layer-text)"></i>type</span>
              <span><i style="background:var(--layer-gfx)"></i>artwork</span>
            </div>
            <div class="spacer"></div>
            <span id="originalMeta">—</span>
          </div>
        </section>

        <!-- ---- RECONSTRUCTED ---- -->
        <section class="proof" aria-label="Reconstructed PDF proof">
          <div class="proof-head">
            <div class="proof-title">Reconstructed</div>
            <div class="spacer"></div>
            <div class="segmented" id="previewModeSeg" role="group" aria-label="Preview mode">
              <button type="button" data-mode="render" aria-pressed="true">Rendered</button>
              <button type="button" data-mode="text" aria-pressed="false">Extracted text</button>
            </div>
          </div>

          <div class="viewport" id="pdfViewport">
            <canvas id="pdfCanvas" aria-label="Reconstructed PDF page"></canvas>
            <div class="empty" id="pdfEmpty">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8.4L19 7.6V21H6z"/><path d="M14.4 3v4.6H19M9 12.5h7M9 15.7h7M9 18.9h4"/></svg>
              <b>The rebuilt page lands here</b>
              <span>Press “Rebuild as PDF”. You’ll get vectors and live, selectable text.</span>
            </div>
          </div>

          <div class="proof-foot">
            <span id="pdfMeta">No PDF built yet</span>
            <div class="spacer"></div>
            <span id="pdfSize">—</span>
          </div>
        </section>

      </div>
