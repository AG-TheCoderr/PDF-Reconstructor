# Deploy the static site to GitHub Pages.
#
# The app is plain HTML/CSS/JS with no build step, so the job publishes the site
# files (index.html plus the css/, html/ and js/ folders) rather than the whole
# repository.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    # Docs-only edits do not change the site, so don't redeploy for them.
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. However, do NOT cancel in-progress runs as we
# want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Stage the publishable site only. Publishing the repository root would
      # also serve README.md (and any future notes) as public web pages.
      - name: Stage site files
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html _site/
          # The app is split into these folders; index.html references them by
          # relative path, so the whole tree has to ship.
          cp -R css html js _site/
          # Fail loudly if any part of the app is missing rather than deploying
          # a half-broken site.
          test -s _site/index.html
          test -s _site/css/tokens.css
          test -s _site/js/runtime.js
          test -s _site/js/boot.js
          # Keep Pages from running Jekyll over the output.
          touch _site/.nojekyll
          printf 'Publishing:\n'
          find _site -type f -printf '  %p (%s bytes)\n' | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
